[Unit]
# Only start this instance when the external keyboard is actually present.
ConditionPathExists=/dev/input/by-id/usb-BY_Tech_Gaming_Keyboard-event-kbd

# Avoid aggressive restart storms during transient USB reconnects.
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=5
TimeoutStartSec=30
