[metadata]
name = "brew"
description = "Search/install/uninstall Homebrew formulae and casks, and manage tap trust"
requirements = ["brew", "jq"]

[source]
command = [
  { name = "Install", run = '''
    brew search --desc "" 2>/dev/null | tail -n +2 | sed -E 's/^([^:]+): (.*)$/install-formula\t\1\t\2\t/' | sed "s/'//g"
  ''' },
  { name = "Cask", run = '''
    brew search --casks --desc "" 2>/dev/null | tail -n +2 | sed -E 's/^([^:]+): (.*)$/install-cask\t\1\t\2\t/' | sed "s/'//g"
  ''' },
  { name = "Installed", run = '''
    brew list --versions 2>/dev/null | awk '{v=$0; sub(/^[^ ]+ /,"",v); print "uninstall\t" $1 "\t" v "\t"}'
  ''' },
  { name = "Trust", run = '''
    trust_json=$(brew trust --json=v1 2>/dev/null)
    trusted_taps=$(printf '%s' "$trust_json" | jq -r '.taps[]? // empty')
    trusted_formulae=$(printf '%s' "$trust_json" | jq -r '.formulae[]? // empty')
    trusted_casks=$(printf '%s' "$trust_json" | jq -r '.casks[]? // empty')

    trusted_tmp=$(mktemp)
    trap 'rm -f "$trusted_tmp"' EXIT

    brew tap 2>/dev/null | while IFS= read -r tap; do
      [ "$tap" = "homebrew/core" ] && continue
      [ "$tap" = "homebrew/cask" ] && continue
      if echo "$trusted_taps" | grep -qxF "$tap"; then
        printf 'trust	%s	tap	 trusted
' "$tap" >> "$trusted_tmp"
      else
        printf 'trust	%s	tap	 untrusted
' "$tap"
      fi
    done

    find "$(brew --cellar)" -maxdepth 3 -name INSTALL_RECEIPT.json -print0 2>/dev/null \
      | xargs -0 jq -r '[input_filename, (.source.tap // "")] | @tsv' 2>/dev/null \
      | while IFS="$(printf '\t')" read -r receipt tap; do
          [ -z "$tap" ] && continue
          [ "$tap" = "homebrew/core" ] && continue
          name=$(basename "$(dirname "$(dirname "$receipt")")")
          fullname="$tap/$name"
          if echo "$trusted_taps" | grep -qxF "$tap" || echo "$trusted_formulae" | grep -qxF "$fullname"; then
            printf 'trust	%s	formula	 trusted
' "$fullname" >> "$trusted_tmp"
          else
            printf 'trust	%s	formula	 untrusted
' "$fullname"
          fi
        done

    find "$(brew --caskroom)" -maxdepth 3 -name INSTALL_RECEIPT.json -print0 2>/dev/null \
      | xargs -0 jq -r '[input_filename, (.source.tap // "")] | @tsv' 2>/dev/null \
      | while IFS="$(printf '\t')" read -r receipt tap; do
          [ -z "$tap" ] && continue
          [ "$tap" = "homebrew/cask" ] && continue
          name=$(basename "$(dirname "$(dirname "$receipt")")")
          fullname="$tap/$name"
          if echo "$trusted_taps" | grep -qxF "$tap" || echo "$trusted_casks" | grep -qxF "$fullname"; then
            printf 'trust	%s	cask	 trusted
' "$fullname" >> "$trusted_tmp"
          else
            printf 'trust	%s	cask	 untrusted
' "$fullname"
          fi
        done

    cat "$trusted_tmp"
  ''' },
]
display = "{split:\\t:3} {split:\\t:1} \u2014 {split:\\t:2}"
output = "{split:\\t:1}"

[preview]
command = '''
kind='{split:\t:0}'
name='{split:\t:1}'
type='{split:\t:2}'
case "$kind" in
  install-cask) brew info --cask "$name" 2>/dev/null ;;
  install-formula|uninstall) brew info "$name" 2>/dev/null ;;
  trust)
    case "$type" in
      *tap*) printf 'Tap: %s\nType: %s\nStatus: %s\n' "$name" "$type" '{split:\t:3}' ;;
      *) printf 'Tap: %s\nType: %s\nStatus: %s\n' "${name%/*}" "$type" '{split:\t:3}' ;;
    esac
    ;;
esac
'''

[keybindings]
enter = "actions:run"

[actions.run]
description = "Install formula (Install) / Install cask (Cask) / Uninstall (Installed) / Toggle trust (Trust)"
separator = "\n"
command = '''
printf '%s\n' '{trim}' | while IFS="$(printf '\t')" read -r kind name col2 col3; do
  case "$kind" in
    install-formula) brew install "$name" ;;
    install-cask) brew install --cask "$name" ;;
    uninstall) brew uninstall "$name" ;;
    trust)
      case "$col2" in
        *tap*) flag=--tap ;;
        *cask*) flag=--cask ;;
        *) flag=--formula ;;
      esac
      case "$col3" in
        *untrusted*) brew trust "$flag" "$name" ;;
        *) brew untrust "$flag" "$name" ;;
      esac
      ;;
  esac
done
'''
mode = "execute"
