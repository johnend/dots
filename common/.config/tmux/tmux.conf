source-file ~/.config/tmux/binds.conf

###############################################################################
# Options
###############################################################################
set -g  default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"

set -g  base-index 1            # start indexing windows at 1, not 0
set -g  detach-on-destroy off   # don't exit tmux when closing session
set -gs escape-time 10          # short delay on esc
set -g  history-limit 50000     # increase from 2000
set -g  renumber-windows on     # renumber all windows when one is closed
set -g  set-clipboard on        # use system clipboard
set -g  status-position top     # move status bar to top (prefer so it doesn't butt up against Neovim's)
set -g  mode-keys vi
set -g  focus-events on
set -g  bell-action none
set -g  mouse on
set -g  display-time 3000
set -g  status-interval 5
set -g  main-pane-width 60% 
set -g  main-pane-height 60% 
set -g  allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

###############################################################################
# Plugins
###############################################################################
set -g @tpm-clean 'U'

set -g @plugin "eduwass/tmux-palette"
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# set -g @continuum-restore 'on'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_status "off"

# Flat status line built from Catppuccin theme colors rather than plugin modules.
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=#{?client_prefix,#{@thm_red},default},fg=#{?client_prefix,#{@thm_bg},#{@thm_green}}]#{?client_prefix,#[bold],}  #S #[nobold]"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$HOME|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰭦 %Y-%m-%d "
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-right "#[bg=default,fg=#{@thm_mauve}] 󰅐 %H:%M "

set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{?window_zoomed_flag,  ,}#W"

# SessionX
set -g @sessionx-fzf-builtin-tmux 'off'
set -g @sessionx-layout 'reverse'
set -g @sessionx-preview-location 'bottom'
set -g @sessionx-ls-command 'eza -lTX --level=1 --icons --color=always --sort=name --group-directories-first'
set -g @sessionx-tmuxinator-mode 'off'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-filter-current 'false'
set -g @sessionx-additional-options "--color=fg:#e0def4,fg+:#e0def4,bg:#191724,bg+:#403d52 --color=hl:#ebbcba,hl+:#ebbcba,info:#c4a7e7,marker:#f6c177 --color=prompt:#FF00AF,spinner:#FF00AF,pointer:#FF00AF,header:#908caa --color=border:#26233a,preview-bg:#1f1d2e,preview-fg:#e0def4,preview-border:#26233a --color=label:#ebbcba,preview-label:#ebbcba,query:#e0def4,disabled:#6e6a86,gutter:#191724,scrollbar:#6e6a86,separator:#524f67"

# Tmux-palette
set -g @palette-key 'off'
bind enter run-shell "~/.config/tmux/plugins/tmux-palette/bin/tmux-palette.sh"

# run the plugins configs etc.
run '~/.config/tmux/plugins/tpm/tpm'

# Layout styling uses Catppuccin's resolved theme variables after TPM loads the plugin.
set -g status-justify absolute-centre
set -gF status-style "bg=default,fg=#{@thm_fg}"

setw -g pane-border-status top
setw -g pane-border-format ""
setw -gF pane-active-border-style "bg=default,fg=#{@thm_overlay_0}"
setw -gF pane-border-style "bg=default,fg=#{@thm_surface_0}"
setw -g pane-border-lines single

setw -g automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -gF window-status-style "bg=default,fg=#{@thm_rosewater}"
set -gF window-status-last-style "bg=default,fg=#{@thm_peach}"
set -gF window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -gF window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -gF window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
